# Reading — short entries for the log at /reading/.
#
# One list item per entry. Newest `date` sorts to the top. Only `date` plus
# a `url` or a `note` is required, so a quick thought is two lines:
#
#   - date: 2026-11-03
#     note: Plan with the model that argues, build with the one that obeys.
#
#   date      required  YYYY-MM-DD, the day you added it
#   url       one of    link to the original; leave it out for a plain note
#   note      one of    my take, shown in full as the large text in the log
#   title     with url  the source's title, shown as the citation link
#   summary   optional  a line or two about the source, shown on a long
#                       note's page (not in the log)
#   type      optional  article | paper | video | tweet | repo; inferred from
#                       the url when left out (arxiv → paper, youtube →
#                       video, github → repo, x.com → tweet, else article)
#   tags      optional  lowercase; not shown, but search matches them
#   archive   optional  archive.ph snapshot; a long note's page links it
#   repo      optional  source code; kept for reference, not shown
#
# A note too long for the log belongs in content/reading/<slug>.mdx instead.
# It gets its own page, and the log shows its first paragraph.
#
# A broken entry fails the build with its number, so a typo never ships.

- title: Model Context Protocol
  url: https://modelcontextprotocol.io/
  repo: https://github.com/modelcontextprotocol/servers
  date: 2026-08-06
  summary: >-
    Open protocol that standardizes how LLM applications connect to tools
    and data sources: one interface instead of per-tool integrations.
  tags: [mcp, tooling, open-source]

- title: llama.cpp
  url: https://github.com/ggml-org/llama.cpp
  date: 2026-08-05
  summary: >-
    LLM inference in plain C/C++; runs large models on laptops and
    commodity hardware through aggressive quantization.
  tags: [inference, open-source]

- title: Attention is all you need
  url: https://arxiv.org/abs/1706.03762
  date: 2026-08-04
  summary: >-
    The paper that introduced the transformer: self-attention replaces
    recurrence entirely, which unlocked parallel training and every model
    since.
  note: >-
    The abstract reads like a dare ("attention is all you need"), and the
    whole industry has spent the years since paying off that sentence. I
    reread it once a year; section 3 lands differently every time.
  tags: [transformers, architecture]

- title: "Let's build GPT: from scratch, in code, spelled out"
  url: https://www.youtube.com/watch?v=kCc8FmEb1nY
  date: 2026-08-03
  summary: >-
    Karpathy builds a GPT from zero in code, tokenization through the
    training loop, in the most-watched transformer walkthrough on YouTube.
  note: >-
    The best two hours you can spend on fundamentals. Watching the attention
    math get typed out line by line removed the magic for me.
  tags: [transformers, teaching]

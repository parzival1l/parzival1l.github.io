# Recommended reading — things I read and want to keep.
#
# One list item per entry. Newest `date` sorts to the top.
#
#   title     required  what shows on the card
#   url       required  link to the original
#   date      required  YYYY-MM-DD, the day you added it
#   type      required  article | paper | video | tweet | repo
#   summary   required  two-liner about the piece, shown inside the card
#   tags      required  lowercase, one or more; they become the filter rows
#   thoughts  optional  my take, rendered above the card quote-tweet style;
#                       long text clamps behind a "Show more" toggle
#   pinned    optional  true surfaces the entry in the left rail
#   archive   optional  archive.ph snapshot; adds the small archive icon
#   repo      optional  source code; adds the small GitHub icon
#
# A missing required field fails the build, so a typo never ships silently.

- title: Building effective agents
  url: https://www.anthropic.com/engineering/building-effective-agents
  archive: https://archive.ph/newest/https://www.anthropic.com/engineering/building-effective-agents
  date: 2026-08-07
  type: article
  pinned: true
  summary: >-
    Anthropic's field guide to agent systems: start with simple workflows,
    and reach for autonomous agents only when the task needs dynamic
    decision-making.
  thoughts: >-
    The distinction between workflows and agents is the part I keep coming
    back to. Most of what teams call "agents" in production are really
    workflows with an LLM step in the middle — the routing and
    parallelization patterns here map directly onto what we ship. The
    uncomfortable corollary: if your use case fits a workflow, an agent
    mostly buys you latency and failure modes. I've started asking "which
    pattern from this post is this?" in design reviews, and half the time
    the honest answer is "an augmented LLM with extra steps." That's not a
    knock — simple patterns are the ones that survive contact with
    production.
  tags: [agents, patterns]

